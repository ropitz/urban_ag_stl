    function(layer){
    let div = L.DomUtil.create('div');
    
    let handleObject = feature => {
        if (feature === null) {
            return '';
        } else if (typeof(feature)=='object') {
            return JSON.stringify(feature);
        } else {
            return feature;
        }
    }
    let fields = ["suitability", "area_sqm", "brown_dist_m", "building_frac", "food_desert"];
    let aliases = ["Suitability 0\u2013100:", "Area (m\u00b2):", "Dist. to brownfield (m):", "Building cover w/in 30 m (0\u20131):", "In food-desert tract (1=yes):"];
    let table = '<table>' +
        String(
        fields.map(
        (v,i)=>
        `<tr>
            <th>${aliases[i].toLocaleString()}</th>
            
            <td>${handleObject(layer.feature.properties[v]).toLocaleString()}</td>
        </tr>`).join(''))
    +'</table>';
    div.innerHTML=table;
    
    return div
    }
